name: 🚀 Django CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: django-rest-app
  PROJECT_NAME: django-rest-aws
  PYTHON_VERSION: '3.11'
  POSTGRES_VERSION: '13'

jobs:
  # === QUALITÉ DU CODE ===
  lint:
    name: "🔍 Lint & Code Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          cd app
          pip install black flake8 mypy

      - name: Run Black
        run: |
          cd app
          black --check .

      - name: Run Flake8
        run: |
          cd app
          flake8 .

  # === TESTS ===
  unit-tests:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        cd app
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov
    
    - name: Run migrations
      run: |
        cd app
        python manage.py makemigrations
        python manage.py migrate
      env:
        DEBUG: 'True'
        DJANGO_SECRET_KEY: 'test-secret-key'
        POSTGRES_DB: testdb
        POSTGRES_USER: testuser
        POSTGRES_PASSWORD: testpass
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
    
    - name: Run tests
      run: |
        cd app
        pytest --cov=myproject --cov-report=xml --cov-report=html -v
      env:
        DEBUG: 'True'
        DJANGO_SECRET_KEY: 'test-secret-key'
        POSTGRES_DB: testdb
        POSTGRES_USER: testuser
        POSTGRES_PASSWORD: testpass
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./app/coverage.xml
        flags: unittests

  # === SÉCURITÉ ===
  security-scan:
    name: "🛡️ Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd app
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          cd app
          bandit -r myproject/ -f html -o bandit-report.html || true

      - name: Run Safety check
        run: |
          cd app
          safety check --json --output safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            app/bandit-report.html
            app/safety-report.json
          retention-days: 30

  # === BUILD & PUSH ===
  build-and-push:
    name: "🏗️ Build & Push to ECR"
    runs-on: ubuntu-latest
    needs: [unit-tests, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'release'
    
    strategy:
      matrix:
        include:
          - environment: development
            if: github.ref == 'refs/heads/develop'
          - environment: production
            if: github.ref == 'refs/heads/main' || github.event_name == 'release'

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Web image
      uses: docker/build-push-action@v5
      with:
        context: ./app
        file: ./app/Dockerfile
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-web:latest
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-web:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          ENVIRONMENT=${{ matrix.environment }}

    - name: Build and push Nginx image
      uses: docker/build-push-action@v5
      with:
        context: ./nginx
        file: ./nginx/Dockerfile
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-nginx:latest
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-nginx:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate deployment info
      run: |
        echo "Environment: ${{ matrix.environment }}"
        echo "Image SHA: ${{ github.sha }}"
        echo "ECR Registry: ${{ steps.login-ecr.outputs.registry }}"

  # === DÉPLOIEMENT DEVELOPMENT ===
  deploy-development:
    name: "🌱 Deploy to Development"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: development
    
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Development
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AWS_EC2_HOST_DEV }}
        username: ${{ secrets.AWS_SSH_USER_DEV }}
        key: ${{ secrets.AWS_SSH_PRIVATE_KEY_DEV }}
        script: |
          set -e
          echo "🔄 Deploying to Development..."
          
          cd /home/${{ secrets.AWS_SSH_USER_DEV }}/app
          
          # Login to ECR
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          
          # Pull latest images
          docker-compose -f docker-compose.development.yml pull
          
          # Stop and remove old containers
          docker-compose -f docker-compose.development.yml down
          
          # Start new containers
          docker-compose -f docker-compose.development.yml up -d
          
          # Run health check
          sleep 30
          curl -f http://localhost/api/books/ || exit 1
          
          # Cleanup
          docker system prune -f
          
          echo "✅ Development deployment completed!"

  # === DÉPLOIEMENT PRODUCTION ===
  deploy-production:
    name: "🚀 Deploy to Production"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    environment: production
    
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Production
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AWS_EC2_HOST_PROD }}
        username: ${{ secrets.AWS_SSH_USER_PROD }}
        key: ${{ secrets.AWS_SSH_PRIVATE_KEY_PROD }}
        script: |
          set -e
          echo "🚀 Deploying to Production..."
          
          cd /home/${{ secrets.AWS_SSH_USER_PROD }}/app
          
          # Login to ECR
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          
          # Pull latest images
          docker-compose -f docker-compose.production.yml pull
          
          # Stop and remove old containers
          docker-compose -f docker-compose.production.yml down
          
          # Start new containers
          docker-compose -f docker-compose.production.yml up -d
          
          # Run health check
          sleep 30
          curl -f http://localhost/api/books/ || exit 1
          
          # Cleanup
          docker system prune -f
          
          echo "✅ Production deployment completed!"

  # === NOTIFICATIONS ===
  notify:
    name: "📢 Notification"
    needs: [deploy-development, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send workflow status
        run: |
          echo "Workflow completed with status: ${{ needs.deploy-production.result || needs.deploy-development.result || 'success' }}"
          echo "View workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"